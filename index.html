<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Índice - Artigos - Sistemas Elétricos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { width: 100%; padding: 10px; font-size: 16px; margin: 12px 0 18px; }
    ul { list-style: none; padding-left: 0; }
    li { padding: 6px 0; border-bottom: 1px solid #eee; }
    a { text-decoration: none; }
    .meta { font-size: 12px; color: #555; }
  </style>
</head>
<body>

  <h1>Índice do Repositório - Artigos - Sistemas Elétricos</h1>
  <p>
    <a href="https://engprbo.github.io/sistemas_eletricos/">⬅ Voltar ao portal</a>
  </p>

  <label for="q"><b>Busca rápida (filtra por texto):</b></label>
  <input id="q" type="text" placeholder="Ex.: wildfire, wind, lightning, resilience, transmission, IEEE, 2024..." />

  <ul id="lista">
	<li>
	</li>
  </ul>

<script>
  const q = document.getElementById('q');
  const lista = document.getElementById('lista');
  q.addEventListener('input', () => {
    const term = q.value.toLowerCase();
    [...lista.querySelectorAll('li')].forEach(li => {
      li.style.display = li.innerText.toLowerCase().includes(term) ? '' : 'none';
    });
  });
</script>

</body>
</html>
